# golangci-lint v2. A finding is fixed, not silenced: do not turn a linter off
# or add an exclusion to make a check pass. The exclusions below are the only
# ones, each with the reason it is not a defect.
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - misspell
  settings:
    misspell:
      locale: US
  exclusions:
    paths:
      - reference
    rules:
      # G204 flags any exec.Command whose arguments are not constants. The job
      # of internal/servertest is to run openvpn with the options a test
      # chooses; its arguments come from test code, never from input.
      - path: internal/servertest/
        linters:
          - gosec
        text: "G204"
      # The same for the test that builds examples/ping and runs it: the
      # program and its arguments are made by the test.
      - path: ^examples/(ping|http)/main_realserver_test\.go$
        linters:
          - gosec
        text: "G204"
      # G505 and G401 flag SHA-1. OpenVPN's tls-auth uses HMAC-SHA1 by default
      # (--auth), and the library must speak it to work with servers that
      # keep the default. The security of an HMAC does not depend on the
      # collision resistance of its hash. Widen the path only for code that
      # builds that digest for tls-auth.
      - path: internal/ctrlwrap/
        linters:
          - gosec
        text: "G505|G401"
      # G404 flags math/rand. The tests use seeded sequences on purpose, so
      # that a failure can be reproduced; nothing here needs unpredictability.
      # The same holds for the faults of internal/vpntest (loss, duplicates,
      # delays from a seed), which is a package for tests only.
      - path: _test\.go|internal/vpntest/
        linters:
          - gosec
        text: "G404"

      # G402 flags InsecureSkipVerify. NewTLSConfig turns off the name check of
      # crypto/tls and nothing else: an OpenVPN server's certificate is not for
      # the address it is dialed at, and the chain is verified in
      # VerifyConnection (tlsconfig.go, with tests for every case). This is
      # the one place the plan allows it (docs/IMPLEMENTATION.md, step 1.11);
      # it is not a path for any other file.
      - path: ^tlsconfig\.go$
        linters:
          - gosec
        text: "G402: TLS InsecureSkipVerify"
      # G101 flags the name "secret" in the table of refused options of the
      # profile parser: it is OpenVPN's option for the static key mode, not a
      # credential.
      - path: ^ovpn/options\.go$
        linters:
          - gosec
        text: "G101"
      # G304 flags a file name that comes from a variable. The tests read the
      # fixtures that they name themselves.
      - path: _test\.go
        linters:
          - gosec
        text: "G304"
      # G703 flags a path that comes from a variable. The tests write into the
      # directories that they made themselves (t.TempDir).
      - path: _test\.go
        linters:
          - gosec
        text: "G703"
      # G304 flags a file name that comes from a variable. The examples are
      # programs for a person at a terminal: the files that a flag names are the
      # files that the person asked them to read.
      - path: ^examples/
        linters:
          - gosec
        text: "G304"
      # G402 also flags a MinVersion below TLS 1.2. Two tests set TLS 1.0 on
      # purpose, to show that the library raises it to TLS 1.2.
      - path: _test\.go
        linters:
          - gosec
        text: "G402: TLS MinVersion too low"

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - reference
