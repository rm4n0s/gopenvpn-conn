# golangci-lint v2. A finding is fixed, not silenced: do not turn a linter off
# or add an exclusion to make a check pass.
version: "2"

run:
  timeout: 10m
  tests: true

linters:
  default: standard
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - ineffassign
    - gosec
    - misspell
  settings:
    misspell:
      locale: US
  exclusions:
    paths:
      - reference

formatters:
  enable:
    - gofmt
  exclusions:
    paths:
      - reference
